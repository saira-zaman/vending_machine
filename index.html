<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vending Machine UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }

        .vending-machine {
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 3px solid #f39c12;
        }

        .machine-title {
            color: #f39c12;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .item-card {
            background: linear-gradient(145deg, #3d5a73, #1e3a5f);
            border: 2px solid #3498db;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            color: white;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.4);
            background: linear-gradient(145deg, #4a7ba7, #2b4a7c);
            border-color: #2ecc71;
        }

        .item-card.selected {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            border-color: #f39c12;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }

        .item-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .item-price {
            font-size: 14px;
            color: #f39c12;
            font-weight: bold;
        }

        .control-section {
            background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
            border: 2px solid #f39c12;
            border-radius: 15px;
            padding: 20px;
        }

        .control-title {
            color: #f39c12;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .amount-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #3498db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            background: #34495e;
            color: white;
            text-align: center;
        }

        .amount-input:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-purchase {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
            grid-column: span 2;
        }

        .btn-purchase:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(46, 204, 113, 0.4);
        }

        .btn-purchase:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
        }

        .btn-clear:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .selected-info {
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: white;
        }

        .info-label {
            color: #95a5a6;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #f39c12;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #2ecc71;
            color: white;
        }

        .status-message.error {
            background: #e74c3c;
            color: white;
        }

        .status-message.info {
            background: #3498db;
            color: white;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stats-title {
            color: #2c3e50;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 3px solid #f39c12;
            padding-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: #34495e;
            font-size: 16px;
        }

        .stat-value {
            font-weight: bold;
            color: #f39c12;
        }

        .purchase-history {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid #ecf0f1;
            color: #2c3e50;
            font-size: 14px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-empty {
            text-align: center;
            color: #95a5a6;
            padding: 20px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .items-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .emoji {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="vending-machine">
            <div class="machine-title">🏪 Vending Machine</div>
            
            <div class="status-message" id="statusMessage"></div>

            <div class="items-grid" id="itemsGrid">
                <!-- Items will be loaded here -->
            </div>

            <div class="control-section">
                <div class="control-title">💳 Payment & Control</div>

                <div class="selected-info">
                    <div class="info-label">Selected Item</div>
                    <div class="info-value" id="selectedItem">None</div>
                    <div class="info-label" style="margin-top: 10px;">Price</div>
                    <div class="info-value" id="selectedPrice">$0.00</div>
                </div>

                <div>
                    <div class="info-label">Enter Amount ($)</div>
                    <input type="number" id="amountInput" class="amount-input" placeholder="1.50" step="0.01" min="0">
                </div>

                <div class="button-group">
                    <button class="btn-clear" onclick="clearSelection()">Clear</button>
                    <button class="btn-clear" onclick="loadItems()">Refresh</button>
                </div>

                <button class="btn-purchase" onclick="purchaseItem()">🛒 Purchase Item</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="stats-box">
                <div class="stats-title">📊 Status</div>
                <div class="stat-item">
                    <span>API Status</span>
                    <span class="stat-value" id="apiStatus">Loading...</span>
                </div>
                <div class="stat-item">
                    <span>Total Items</span>
                    <span class="stat-value" id="totalItems">0</span>
                </div>
                <div class="stat-item">
                    <span>Total Purchases</span>
                    <span class="stat-value" id="totalPurchases">0</span>
                </div>
                <div class="stat-item">
                    <span>Total Revenue</span>
                    <span class="stat-value" id="totalRevenue">$0.00</span>
                </div>
            </div>

            <div class="purchase-history">
                <div class="stats-title">📜 Purchase History</div>
                <div id="historyList" class="history-empty">No purchases yet</div>
            </div>
        </div>
    </div>

    <script>
        let selectedItem = null;
        let purchaseHistory = [];
        let totalRevenue = 0;

        // Load items on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadItems();
            checkAPIStatus();
        });

        async function loadItems() {
            try {
                const response = await fetch('/api/items');
                const data = await response.json();
                displayItems(data.items);
                document.getElementById('totalItems').textContent = data.items.length;
            } catch (error) {
                showMessage('Failed to load items', 'error');
            }
        }

        function displayItems(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-name">
                        <span class="emoji">${getEmoji(item.name)}</span>
                        ${item.name}
                    </div>
                    <div class="item-price">$${item.price.toFixed(2)}</div>
                `;
                card.onclick = () => selectItem(item);
                grid.appendChild(card);
            });
        }

        function getEmoji(name) {
            const emojis = {
                'Coke': '🥤',
                'Pepsi': '🥤',
                'Water': '💧',
                'Chips': '🍟'
            };
            return emojis[name] || '📦';
        }

        function selectItem(item) {
            selectedItem = item;
            document.getElementById('selectedItem').textContent = item.name;
            document.getElementById('selectedPrice').textContent = `$${item.price.toFixed(2)}`;
            document.getElementById('amountInput').value = item.price.toFixed(2);

            // Highlight selected card
            document.querySelectorAll('.item-card').forEach((card, index) => {
                card.classList.remove('selected');
            });
            event.target.closest('.item-card').classList.add('selected');

            showMessage(`${getEmoji(item.name)} ${item.name} selected!`, 'info');
        }

        async function purchaseItem() {
            if (!selectedItem) {
                showMessage('Please select an item first', 'error');
                return;
            }

            const amount = parseFloat(document.getElementById('amountInput').value);

            if (!amount || amount < selectedItem.price) {
                showMessage(`Insufficient amount. Required: $${selectedItem.price.toFixed(2)}`, 'error');
                return;
            }

            try {
                const response = await fetch(
                    `/api/purchase?item_id=${selectedItem.id}&amount=${amount}`,
                    { method: 'POST' }
                );
                const data = await response.json();

                if (data.success) {
                    showMessage(`✅ Purchase successful! ${getEmoji(selectedItem.name)} ${selectedItem.name} dispensed!`, 'success');
                    
                    // Update history and stats
                    addToHistory(selectedItem, amount);
                    totalRevenue += amount;
                    document.getElementById('totalRevenue').textContent = `$${totalRevenue.toFixed(2)}`;
                    document.getElementById('totalPurchases').textContent = purchaseHistory.length;

                    clearSelection();
                } else {
                    showMessage('Purchase failed', 'error');
                }
            } catch (error) {
                showMessage('Error processing purchase', 'error');
            }
        }

        function addToHistory(item, amount) {
            const now = new Date();
            const time = now.toLocaleTimeString();
            purchaseHistory.unshift({
                item: item.name,
                amount: amount,
                time: time,
                emoji: getEmoji(item.name)
            });

            updateHistory();
        }

        function updateHistory() {
            const historyList = document.getElementById('historyList');
            if (purchaseHistory.length === 0) {
                historyList.innerHTML = '<div class="history-empty">No purchases yet</div>';
                return;
            }

            historyList.innerHTML = purchaseHistory.map((item, index) => `
                <div class="history-item">
                    <strong>${item.emoji} ${item.item}</strong> - $${item.amount.toFixed(2)} <span style="color: #95a5a6; font-size: 12px;">${item.time}</span>
                </div>
            `).join('');
        }

        function clearSelection() {
            selectedItem = null;
            document.getElementById('selectedItem').textContent = 'None';
            document.getElementById('selectedPrice').textContent = '$0.00';
            document.getElementById('amountInput').value = '';
            document.querySelectorAll('.item-card').forEach(card => {
                card.classList.remove('selected');
            });
            showMessage('Selection cleared', 'info');
        }

        async function checkAPIStatus() {
            try {
                const response = await fetch('/health');
                if (response.ok) {
                    document.getElementById('apiStatus').textContent = '🟢 Online';
                    document.getElementById('apiStatus').style.color = '#2ecc71';
                } else {
                    document.getElementById('apiStatus').textContent = '🔴 Offline';
                }
            } catch (error) {
                document.getElementById('apiStatus').textContent = '🔴 Offline';
            }
        }

        function showMessage(message, type) {
            const msgEl = document.getElementById('statusMessage');
            msgEl.textContent = message;
            msgEl.className = `status-message show ${type}`;
            setTimeout(() => {
                msgEl.classList.remove('show');
            }, 3000);
        }

        // Check API status every 10 seconds
        setInterval(checkAPIStatus, 10000);
    </script>
</body>
</html>
